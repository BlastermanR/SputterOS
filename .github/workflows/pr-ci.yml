name: PR CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE: cmake
  CTEST: ctest
  NINJA: ninja
  LLVM_COV: llvm-cov
  LLVM_PROFDATA: llvm-profdata

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make ninja-build
          pip install clang-format==21.1.8

      - name: Run formatter
        run: make format

      - name: Verify formatting is clean
        run: |
          git status --short
          git diff --exit-code

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make ninja-build

      - name: Run unit tests
        run: make unitTest

  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make ninja-build

      - name: Run system tests
        run: make systemTest

  example-projects:
    name: Example Projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make ninja-build

      - name: Run example projects
        run: make exampleProjects

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ llvm make ninja-build

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage text report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-text
          path: tests/build_coverage/coverage_report.txt
          if-no-files-found: error

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: tests/build_coverage/coverage_html
          if-no-files-found: error

      - name: Publish coverage summary
        run: |
          echo "## Coverage Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Text report: tests/build_coverage/coverage_report.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTML report: tests/build_coverage/coverage_html/index.html" >> "$GITHUB_STEP_SUMMARY"

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake g++ make ninja-build

      - name: Run clang-tidy
        run: make tidy

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: tests/build/clang-tidy-report.txt
          if-no-files-found: warn

  docs:
    name: Documentation (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate API documentation
        run: make docs

      - name: Verify documentation generated
        run: test -f docs/api/html/index.html

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/html
          if-no-files-found: error
