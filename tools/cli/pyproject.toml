[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sputterctl"
version = "0.1.0"
description = "CLI tool for SputterOS dual-mode comms (TEXT + COBS-framed binary)"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pyserial>=3.5",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
sputterctl = "sputterctl.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
